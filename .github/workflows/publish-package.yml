name: Build and attach release ZIP

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify project
        run: ./mvnw --batch-mode verify

  release:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set artifact version from tag
        run: ./mvnw --batch-mode org.codehaus.mojo:versions-maven-plugin:2.19.1:set "-DnewVersion=${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build executable JAR
        run: ./mvnw --batch-mode package

      - name: Assemble release ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp "target/pix-payment-service-${VERSION}.jar" release-assets/
          cp README.md release-assets/
          cd release-assets
          zip -q "../pix-payment-service-${VERSION}.zip" "pix-payment-service-${VERSION}.jar" README.md

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pix-payment-service-*.zip